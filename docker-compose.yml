services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appointment_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - appointment_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  appointment_postgres:
